# Local end-to-end demo: Airflow -> ingestion worker -> OpenClaw (investigator) -> LINE.
# Use the Makefile targets (make demo-up / demo-trigger / demo-dry); they build
# and stage the artifacts these services expect.
name: openclaw-line-demo

x-openclaw-env: &openclaw-env
  OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
  OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN}
  # Model: Moonshot Kimi K3 (international endpoint by default; use https://api.moonshot.cn/v1 for China)
  OPENCLAW_MODEL: ${OPENCLAW_MODEL:-moonshot/kimi-k3}
  MOONSHOT_API_KEY: ${MOONSHOT_API_KEY}
  MOONSHOT_BASE_URL: ${MOONSHOT_BASE_URL:-https://api.moonshot.ai/v1}
  # Backup model when Kimi K3 fails (openclaw/openclaw.json5). Without a key the
  # fallback attempt fails too and the worker sends its fallback notice.
  OPENCLAW_FALLBACK_MODEL: ${OPENCLAW_FALLBACK_MODEL:-google/gemini-3.8-flash}
  # Google AI Studio key (OpenClaw also accepts GOOGLE_API_KEY).
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-unset}
  LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-unset}
  # Read-only credentials for the investigator's tools
  AIRFLOW_BASE_URL: http://airflow:8080
  AIRFLOW_USERNAME: investigator
  AIRFLOW_PASSWORD: ${AIRFLOW_VIEWER_PASSWORD}
  # report-capture plugin signs forwarded reports with the worker's shared secret
  WEBHOOK_SECRET: ${WEBHOOK_SECRET}
  # get_databricks_run_error: read-only service principal (CAN_VIEW on the job only).
  # The runner credentials go to Airflow alone; the gateway never sees them.
  DATABRICKS_HOST: ${DATABRICKS_HOST:-}
  DATABRICKS_CLIENT_ID: ${DATABRICKS_READER_CLIENT_ID:-}
  DATABRICKS_CLIENT_SECRET: ${DATABRICKS_READER_CLIENT_SECRET:-}
  # get_git_file_diff: the seeded demo repo by default; set GIT_PROVIDER=github with a
  # fine-grained read-only token (Contents: read) to read the real repository.
  GIT_PROVIDER: ${GIT_PROVIDER:-local}
  LOCAL_REPO_PATH: /data/repo
  GITHUB_REPO: ${GITHUB_REPO:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GIT_REF: ${GIT_REF:-}
  GIT_PATH_PREFIXES: ${GIT_PATH_PREFIXES:-}

services:
  airflow:
    # Stock Airflow plus the Databricks provider (demo/airflow.Dockerfile).
    image: openclaw-line/airflow:local
    build:
      context: ..
      dockerfile: demo/airflow.Dockerfile
      args:
        AIRFLOW_IMAGE: ${AIRFLOW_IMAGE:-apache/airflow:3.3.2}
    restart: unless-stopped
    # Linux hosts: set AIRFLOW_UID to your uid (id -u) so Airflow can write the
    # bind-mounted passwords file; the image supports any uid with gid 0.
    user: "${AIRFLOW_UID:-50000}:0"
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      # dashboard: role "user" (may start DAG runs), used only by the worker's "Run pipeline" button.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin,investigator:viewer,dashboard:user"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
      # URL your browser uses for the Airflow UI (login redirects and log links).
      AIRFLOW__API__BASE_URL: ${AIRFLOW_PUBLIC_URL:-http://localhost:8080}
      # Tasks call the Execution API at {base_url}/execution/ by default; with a public
      # base URL behind Cloudflare Access that returns a login redirect and tasks hang.
      # Keep task traffic inside the container.
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      OPENCLAW_INGEST_URL: http://ingestion-worker:8080/v1/airflow/failure
      OPENCLAW_WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      STRIPE_EVENTS_PATH: /opt/airflow/data/stripe_events.json
      # databricks_daily_revenue DAG: sp-airflow-runner (CAN_MANAGE_RUN on the job only),
      # OAuth client credentials. Empty values just leave that DAG unusable.
      DATABRICKS_JOB_ID: ${DATABRICKS_JOB_ID:-}
      AIRFLOW_CONN_DATABRICKS_DEFAULT: '{"conn_type": "databricks", "host": "${DATABRICKS_HOST:-}", "login": "${DATABRICKS_RUNNER_CLIENT_ID:-}", "password": "${DATABRICKS_RUNNER_CLIENT_SECRET:-}", "extra": {"service_principal_oauth": true}}'
    volumes:
      # Airflow home (SQLite metadata DB, task logs, generated airflow.cfg) in a
      # named volume so run history survives container recreation.
      - airflow-home:/opt/airflow
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../airflow/plugins:/opt/airflow/plugins:ro
      - ./fixtures:/opt/airflow/data:ro
      - ./.state/airflow-auth:/opt/airflow/auth
    ports:
      # Loopback by default. On a server, set AIRFLOW_BIND_ADDRESS to its LAN IP
      # (and AIRFLOW_PUBLIC_URL to match) to reach the login page from the network.
      - "${AIRFLOW_BIND_ADDRESS:-127.0.0.1}:${AIRFLOW_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"]
      interval: 10s
      retries: 30
      start_period: 30s

  ingestion-worker:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: demo/worker.Dockerfile
    environment:
      PORT: "8080"
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      DEDUPE_WINDOW_S: ${DEDUPE_WINDOW_S:-30}
      AIRFLOW_BASE_URL: http://airflow:8080
      AIRFLOW_API_VERSION: v2
      AIRFLOW_USERNAME: investigator
      AIRFLOW_PASSWORD: ${AIRFLOW_VIEWER_PASSWORD}
      DRY_RUN: ${DRY_RUN:-0}
      INCIDENT_DIR: /incidents
      OPENCLAW_GATEWAY_URL: http://openclaw-gateway:18789
      OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN}
      # Kimi K3 always reasons at max effort on the direct Moonshot route; allow time.
      OPENCLAW_TIMEOUT_S: ${OPENCLAW_TIMEOUT_S:-300}
      LINE_TARGET_ID: ${LINE_TARGET_ID}
      # Phase 3 feedback: card + fallback pushes, LINE webhook, incident/feedback log.
      # Feedback is off when the LINE credentials are missing ("unset").
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-unset}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-unset}
      PUBLIC_PORT: "8091"
      FEEDBACK_DB_PATH: /data/feedback.db
      FEEDBACK_SIGNING_KEY: ${FEEDBACK_SIGNING_KEY:-}
      FEEDBACK_USER_SALT: ${FEEDBACK_USER_SALT:-}
      # Label only (stored per incident); not sent to the gateway as a model override.
      OPENCLAW_MODEL_LABEL: ${OPENCLAW_MODEL:-moonshot/kimi-k3}
      # Public dashboard (dashboard.<domain> via the named tunnel) behind Cloudflare
      # Access. The listener only starts when all three CF/allow-list values are set.
      DASHBOARD_PORT: "8092"
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      DASHBOARD_ALLOWED_EMAILS: ${DASHBOARD_ALLOWED_EMAILS:-}
      # Databricks job status on the dashboard: the investigator's read-only
      # service principal (CAN_VIEW on the job). Off unless all four are set.
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_JOB_ID: ${DATABRICKS_JOB_ID:-}
      DATABRICKS_CLIENT_ID: ${DATABRICKS_READER_CLIENT_ID:-}
      DATABRICKS_CLIENT_SECRET: ${DATABRICKS_READER_CLIENT_SECRET:-}
      # Dashboard "Run pipeline" button: Airflow account "dashboard" (role user). Off when unset.
      AIRFLOW_TRIGGER_PASSWORD: ${AIRFLOW_TRIGGER_PASSWORD:-}
      DASHBOARD_TRIGGER_DAG: ${DASHBOARD_TRIGGER_DAG:-databricks_daily_revenue}
      # Cost tracking: model prices in USD per million tokens (unset = tokens only).
      MODEL_PRICE_INPUT_PER_MTOK: ${MODEL_PRICE_INPUT_PER_MTOK:-}
      MODEL_PRICE_OUTPUT_PER_MTOK: ${MODEL_PRICE_OUTPUT_PER_MTOK:-}
      MODEL_PRICE_CACHE_READ_PER_MTOK: ${MODEL_PRICE_CACHE_READ_PER_MTOK:-}
      # Calls answered by the fallback model are priced with these.
      OPENCLAW_FALLBACK_MODEL: ${OPENCLAW_FALLBACK_MODEL:-google/gemini-3.8-flash}
      FALLBACK_MODEL_PRICE_INPUT_PER_MTOK: ${FALLBACK_MODEL_PRICE_INPUT_PER_MTOK:-}
      FALLBACK_MODEL_PRICE_OUTPUT_PER_MTOK: ${FALLBACK_MODEL_PRICE_OUTPUT_PER_MTOK:-}
      FALLBACK_MODEL_PRICE_CACHE_READ_PER_MTOK: ${FALLBACK_MODEL_PRICE_CACHE_READ_PER_MTOK:-}
      FALLBACK_MODEL_PRICE_CACHE_WRITE_PER_MTOK: ${FALLBACK_MODEL_PRICE_CACHE_WRITE_PER_MTOK:-}
      # Alerts (Healthchecks.io ping URLs; each optional): heartbeat = worker/server
      # down or gateway not ready or backup failed; LINE = a LINE push failed.
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      HEALTHCHECK_LINE_URL: ${HEALTHCHECK_LINE_URL:-}
      HEALTHCHECK_INTERVAL_S: ${HEALTHCHECK_INTERVAL_S:-300}
      # Daily copies of feedback.db in /data/backups (demo/.state/feedback/backups); 0 = off.
      FEEDBACK_BACKUP_KEEP: ${FEEDBACK_BACKUP_KEEP:-14}
    volumes:
      - ./.state/incidents:/incidents
      - ./.state/feedback:/data
    ports:
      - "127.0.0.1:${WORKER_HOST_PORT:-8090}:8080"
      # LINE webhook listener (only /line/webhook); published through the tunnel.
      - "127.0.0.1:${WEBHOOK_HOST_PORT:-8091}:8091"
    depends_on:
      - airflow

  # LINE + Moonshot plugins are installed into the image at build time.
  # No state volume: every container start is clean (incidents are stateless anyway).
  openclaw-gateway:
    image: openclaw-line/gateway:local
    restart: unless-stopped
    build:
      context: ..
      dockerfile: demo/openclaw.Dockerfile
    environment: *openclaw-env
    volumes:
      # Read-only evidence sources for the plugin tools
      - ./.state/repo:/data/repo:ro
      - ./dbt:/data/dbt:ro
      # Dry-run incident messages written by the worker
      - ./.state/incidents:/incidents:ro
    ports:
      # Loopback only: the gateway token is an operator credential. Host port defaults
      # to 18790 so it does not clash with a locally installed OpenClaw gateway (18789).
      - "127.0.0.1:${OPENCLAW_GATEWAY_HOST_PORT:-18790}:18789"

  # Phase 3: public HTTPS for the LINE webhook. The tunnel only reaches the
  # worker's public listener (:8091), which serves nothing but /line/webhook.
  # `make demo-tunnel` starts one of these and registers the URL with LINE.
  #
  # Quick tunnel (no Cloudflare account): a new *.trycloudflare.com URL per start.
  tunnel-quick:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    profiles: ["tunnel-quick"]
    command: tunnel --no-autoupdate --url http://ingestion-worker:8091
    depends_on:
      - ingestion-worker

  # Named tunnel (stable hostname): create it in Cloudflare Zero Trust with a
  # public hostname -> http://ingestion-worker:8091, then set
  # CLOUDFLARE_TUNNEL_TOKEN and PUBLIC_WEBHOOK_BASE_URL in demo/.env.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - ingestion-worker

volumes:
  airflow-home:
