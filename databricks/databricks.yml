# Databricks Asset Bundle for the real (Databricks on GCP) version of the
# daily revenue pipeline. Airflow triggers the job; failures reach the
# investigator through the same notify_openclaw callback as the demo DAG.
bundle:
  name: openclaw_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog with the bronze/silver/gold schemas (created by hand, see README).
    default: lakehouse

targets:
  prod:
    default: true
    workspace:
      host: https://8259562386951628.8.gcp.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
