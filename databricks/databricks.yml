# Databricks Asset Bundle for the real (Databricks on GCP) version of the
# daily revenue pipeline. Airflow triggers the job; failures reach the
# investigator through the same notify_openclaw callback as the demo DAG.
bundle:
  name: openclaw_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog with the bronze/silver/gold schemas (created by hand, see README).
    default: lakehouse
  airflow_runner_sp:
    description: Application ID of sp-airflow-runner (Airflow starts runs; CAN_MANAGE_RUN on the job).
  investigator_reader_sp:
    description: Application ID of the investigator's read-only service principal (CAN_VIEW on the job).

# Top-level permissions apply to every resource and to the deployed files: the
# investigator's reader gets CAN_VIEW on the job and CAN_READ on the notebooks, so it
# can map a failed task to its notebook id in Unity Catalog lineage.
permissions:
  - level: CAN_VIEW
    service_principal_name: ${var.investigator_reader_sp}

targets:
  prod:
    default: true
    variables:
      airflow_runner_sp: 5373a47d-a478-4279-b92b-e3ccfa13d2c3
      investigator_reader_sp: d70ea6d2-64fc-4a74-af75-39192a33d4de
    workspace:
      host: https://8259554454724321.1.gcp.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
